<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3e9d8" />
    <title>Кубоскульптор</title>
    <style>
      /* Лёгкий экран загрузки: виден до загрузки основного бандла. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f3e9d8;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 40%, #fbf4e8 0%, #f3e9d8 55%, #e6d3b3 100%);
        z-index: 100;
        transition: opacity 0.35s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .cube {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: linear-gradient(145deg, #f7ecd9, #d9c2a0);
        box-shadow:
          inset -4px -4px 0 rgba(0, 0, 0, 0.08),
          inset 4px 4px 0 rgba(255, 255, 255, 0.6),
          0 8px 16px rgba(90, 60, 30, 0.2);
        animation: boot-bob 1.2s ease-in-out infinite;
      }
      #boot .bar {
        width: 160px;
        height: 8px;
        border-radius: 4px;
        background: rgba(122, 79, 44, 0.15);
        overflow: hidden;
      }
      #boot .bar > i {
        display: block;
        height: 100%;
        width: 5%;
        border-radius: 4px;
        background: #2bb3a3;
        transition: width 0.2s ease;
      }
      @keyframes boot-bob {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }
        50% {
          transform: translateY(-8px) rotate(4deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="cube"></div>
      <div class="bar"><i id="boot-progress"></i></div>
    </div>
    <div id="app">
      <div id="stage"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
